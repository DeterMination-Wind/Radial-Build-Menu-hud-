setting.rbm-sync-he-fast-slots.name = 和 He 的快捷選擇欄同步
setting.rbm-sync-he-fast-slots.description = 用 Helium 目前可見的快捷欄頁覆蓋圓盤選單。槽位 1-8 對應 He，槽位 9-16 保持為空。

setting.rbm-toggle-slot-groups-enabled.name = 按鍵切換槽位組
setting.rbm-toggle-slot-groups-enabled.description = 啟用後，可使用快捷鍵在「槽位組A / 槽位組B」之間即時切換圓盤 HUD。啟用後時間/星球/條件等規則將被忽略，只使用這兩組槽位（在「槽位組設定」中配置）。

