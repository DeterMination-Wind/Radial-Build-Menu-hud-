rbm.cond.help = 變數：@second，@unitcount（自己隊單位總數），@copper/@lead/...（自己隊核心物資），@monocount/@flarecount/...（自己隊某單位數量）。運算子：&&，||，xor，!，>，>=，<，<=，==，!=。非 0 視為 true。
