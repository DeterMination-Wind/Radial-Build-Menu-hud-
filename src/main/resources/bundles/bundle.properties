rbm.cond.help = Variables: @second, @unitcount (your team's units), @copper/@lead/... (your team's core items), @monocount/@flarecount/... (your team's unit type counts). Operators: &&, ||, xor, !, >, >=, <, <=, ==, !=. Non-zero is true.
rbm.cond.placeholder = Example: @second > 120 && @copper >= 1000
rbm.cond.initial.condition = Condition (initial profile)
rbm.cond.initial.slots = Initial profile slots (1-16)
rbm.cond.after.enable = Enable later switch
rbm.cond.after.condition = Condition (switch profile, latched once true)
rbm.cond.after.slots = Switch profile slots (1-16)

setting.rbm-time-minutes.name = Time Switch (minutes)
setting.rbm-time-minutes.description = When map time reaches this many minutes, the radial menu uses the Time Slots profile. Set to 0 to disable.

setting.rbm-toggle-slot-groups-enabled.name = Hotkey: Toggle Slot Groups
setting.rbm-toggle-slot-groups-enabled.description = Enable a dedicated hotkey to instantly switch the radial HUD between Slot Group A and Slot Group B. When enabled, all other rule systems (time/planet/conditional) are ignored and only these two groups are used. Configure the two groups in Slot Groups.

